{% load static %}
<!doctype html>
<html lang="en" class="h-full bg-black text-white antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI powered job assistant : upload your resume and find matching jobs instantly." />
    <title>Hidani Job Assistant</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CDN fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Poppins', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="{% static 'dist/styles.css' %}" />
    <style>
      body, input, button, table, div, span, p, h1, h2, h3 {
        font-family: 'Poppins', sans-serif !important;
      }
    </style>
  </head>
  <body class="h-full bg-black text-neutral-100 flex flex-col font-sans">
    <div id="app" class="flex flex-col h-screen max-w-4xl w-full mx-auto border-x border-neutral-900 bg-black shadow-2xl">

      <!-- Header -->
      <header id="header" class="flex items-center justify-between px-6 py-4 border-b border-neutral-800 bg-black/90 backdrop-blur sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-white text-black font-black text-sm rounded flex items-center justify-center tracking-tight shadow-sm font-sans">
            H
          </div>
          <div>
            <h1 class="text-sm font-semibold tracking-wide uppercase text-white font-sans">Hidani Job Assistant</h1>
            <div class="text-xs text-neutral-400 font-medium font-sans">AI powered job matching and applications</div>
          </div>
        </div>
        <div>
          <span id="resume-badge" class="hidden text-xs font-medium px-2.5 py-1 rounded border border-neutral-700 bg-neutral-900 text-neutral-200 uppercase tracking-wider font-sans">
            Resume Loaded
          </span>
        </div>
      </header>

      <!-- Chat / Content Log -->
      <div id="log" role="log" aria-live="polite" class="flex-1 overflow-y-auto px-6 py-6 space-y-4"></div>

      <!-- Input Bar -->
      <div id="input-bar" class="p-4 border-t border-neutral-800 bg-black/95">
        <input id="file-input" type="file" accept=".pdf,.docx" class="hidden" aria-label="Upload resume" />
        <div class="flex items-center gap-2 bg-neutral-950 border border-neutral-800 rounded-lg p-1.5 focus-within:border-white transition-colors">
          <button id="attach-btn" type="button" title="Upload resume (PDF or DOCX)" aria-label="Attach resume" class="p-2 text-neutral-400 hover:text-white rounded hover:bg-neutral-900 transition-colors cursor-pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <input
            id="msg-input"
            type="text"
            placeholder="Ask anything: 'find frontend jobs', 'show remote roles', 'apply to 1, 2'..."
            autocomplete="off"
            spellcheck="false"
            maxlength="2000"
            class="flex-1 bg-transparent border-0 outline-none px-2 py-1.5 text-sm text-neutral-100 placeholder-neutral-500 font-sans"
          />
          <button id="send-btn" type="button" class="px-4 py-2 bg-white text-black hover:bg-neutral-200 text-xs font-semibold rounded uppercase tracking-wider transition-colors disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer font-sans">
            Send
          </button>
        </div>
      </div>

    </div>
    <script src="{% static 'dist/main.js' %}"></script>
  </body>
</html>
